<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caderneta — Administração</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--mut:#6b6f76;--line:#e3dfd6;--acc:#1f6f5c;--accs:#e3f1ec;--warn:#b4472b;--warns:#fbe9e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1e2125;--ink:#ecebe7;--mut:#9aa0a6;--line:#2e3237;--acc:#5cc3a4;--accs:#1d3530;--warn:#ef8a6f;--warns:#3a2420}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1e2125;--ink:#ecebe7;--mut:#9aa0a6;--line:#2e3237;--acc:#5cc3a4;--accs:#1d3530;--warn:#ef8a6f;--warns:#3a2420}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:18px 16px 0;max-width:720px;margin:auto}
h1{font-size:22px;margin:0 0 12px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
nav button{flex:1;min-width:max-content;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:720px;margin:auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;align-items:end}.row>*{flex:1}.row .q{flex:0 0 80px}
.btn{border:0;background:var(--acc);color:#fff;padding:11px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--accs);color:var(--acc)}.btn.del{background:transparent;color:var(--warn);padding:6px 8px}
.btn:disabled{opacity:.5}
.it{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px}
.it:last-child{border:0}
.tot{font-size:20px;font-weight:700;text-align:right;margin:10px 0}
.mut{color:var(--mut);font-size:13px}
.cli{font-weight:700;font-size:17px}
.badge{background:var(--warns);color:var(--warn);border-radius:20px;padding:3px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.badge.ok{background:var(--accs);color:var(--acc)}
.conta{padding:10px 0;border-top:1px dashed var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.st b{display:block;font-size:18px}.st span{font-size:12px;color:var(--mut)}@media(max-width:420px){.st b{font-size:15px}}
.msg{text-align:center;color:var(--mut);padding:30px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}@media(min-width:600px){.ov{align-items:center}}
.modal{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.modal .big{font-size:22px;font-weight:800;text-align:right;margin:12px 0}
.fp{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}.fp label{margin:0;flex:1}
.fp input{display:none}.fp span{display:block;text-align:center;padding:9px;border:1px solid var(--line);border-radius:9px;cursor:pointer;color:var(--ink);font-size:14px}
.fp input:checked+span{background:var(--accs);border-color:var(--acc);color:var(--acc);font-weight:700}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:0 0 14px}.chk input{width:20px;height:20px}
.acts{display:flex;gap:8px}.acts .btn{flex:1}
.chat{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto;padding:4px 2px 10px}
.bub{max-width:80%;padding:9px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.bub.eu{align-self:flex-end;background:var(--accs);border-color:transparent}
.bub small{display:block;font-size:11px;color:var(--mut);margin-top:3px}
.send{display:flex;gap:8px}.send textarea{flex:1;min-height:44px;max-height:120px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.cnt{background:#d33;color:#fff;border-radius:20px;font-size:11px;padding:0 6px;margin-left:4px;font-weight:700}
.av{background:var(--warns);color:var(--warn);padding:1px 7px;border-radius:6px;font-size:14px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;display:none}
</style>
</head><body>
<header><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px"><h1 style="margin:0">📊 Caderneta — Administração</h1><button class="btn sec nbtn" onclick="pedirNotif()">🔕 Ativar notificações</button></div>
<div class="stats" id="stats"></div><input id="busca" placeholder="🔍 Buscar cliente" style="margin-bottom:10px"><nav><button data-t="devendo" class="on">Devendo</button><button data-t="pagos">Pagos</button><button data-t="recados">💬 Recados<b class="cnt" id="rc" style="display:none"></b></button></nav></header>
<main id="app"><div class="msg">Carregando…</div></main>
<div id="toast"></div>
<div class="ov" id="ov"><div class="modal">
<h2>Confirmar pagamento</h2><div class="mut" id="mSub"></div>
<div id="mItens" style="margin-top:10px"></div><div class="big" id="mTot"></div>
<label>Forma de pagamento</label>
<div class="fp"><label><input type="radio" name="fp" value="Dinheiro"><span>💵 Dinheiro</span></label><label><input type="radio" name="fp" value="Pix"><span>⚡ Pix</span></label><label><input type="radio" name="fp" value="Cartão"><span>💳 Cartão</span></label></div>
<label class="chk"><input type="checkbox" id="mChk"> Confirmo que recebi este valor</label>
<div class="acts"><button class="btn sec" id="mNo">Cancelar</button><button class="btn" id="mOk" disabled>Confirmar</button></div>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCCIurNw6ZI4eYCPLxfZK0TXIfhQKJxCRU",
  authDomain: "leme1adm.firebaseapp.com",
  projectId: "leme1adm",
  storageBucket: "leme1adm.firebasestorage.app",
  messagingSenderId: "938106754737",
  appId: "1:938106754737:web:119b8e5407648b4b963490"
};
</script>
<script>
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=ms=>new Date(ms).toLocaleDateString('pt-BR');
let recados=[],tab='devendo',busca='',db=null,produtos=[],contas=[],carrinho=[],cliente='';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.getElementById('busca').style.display=tab==='recados'?'none':'';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
const total=c=>c.itens.reduce((s,i)=>s+i.qtd*i.preco,0);

function stats(){
 const dev=contas.filter(c=>!c.pago),m=new Date();
 const mes=contas.filter(c=>c.pago&&c.pagoEm&&new Date(c.pagoEm).getMonth()===m.getMonth()&&new Date(c.pagoEm).getFullYear()===m.getFullYear());
 document.getElementById('stats').innerHTML=`<div class="st"><span>A receber</span><b style="color:var(--warn)">${brl(dev.reduce((s,c)=>s+total(c),0))}</b></div><div class="st"><span>Clientes devendo</span><b>${new Set(dev.map(c=>c.cliente)).size}</b></div><div class="st"><span>Recebido no mês</span><b style="color:var(--acc)">${brl(mes.reduce((s,c)=>s+total(c),0))}</b></div>`;
}
document.getElementById('busca').oninput=e=>{busca=e.target.value.toLowerCase().trim();render()};
function render(){
 const a=document.getElementById('app');
 if(!db){a.innerHTML='<div class="msg">Não foi possível conectar ao banco de dados. Confira a configuração do Firebase no arquivo.</div>';return}
 if(tab==='recados'){
  a.innerHTML=`<div class="card"><div class="chat" id="chat"></div><div class="send"><textarea id="rt" placeholder="Responder…"></textarea><button class="btn" id="rs">Enviar</button></div></div>`;
  listaRecados();
  document.getElementById('rs').onclick=async()=>{const rt=document.getElementById('rt'),rs=document.getElementById('rs'),t=rt.value.trim();if(!t)return;rs.disabled=true;try{await db.collection('recados').add({de:'chefe',texto:t,data:Date.now(),lido:false});rt.value=''}catch(e){toast('Erro ao enviar')}rs.disabled=false;rt.focus()};
  return}
{
  const pago=tab==='pagos';const lista=contas.filter(c=>!!c.pago===pago&&c.cliente.toLowerCase().includes(busca));
  if(!lista.length){a.innerHTML=`<div class="msg">${pago?'Nenhuma conta paga ainda.':'Ninguém devendo 🎉'}</div>`;return}
  const grupos={};lista.forEach(c=>(grupos[c.cliente]??=[]).push(c));
  const ord=Object.entries(grupos).sort((x,y)=>pago?0:x[0].localeCompare(y[0]));
  const geral=lista.reduce((s,c)=>s+total(c),0);
  a.innerHTML=(pago?'':`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span>Total a receber</span><span class="badge">${brl(geral)}</span></div>`)+ord.map(([n,cs])=>`<div class="card"><div class="it" style="border:0;padding-top:0"><span class="cli">${esc(n)}</span><span class="badge ${pago?'ok':''}">${brl(cs.reduce((s,c)=>s+total(c),0))}</span></div>
  ${cs.sort((x,y)=>y.data-x.data).map(c=>`<div class="conta"><div>${c.itens.map(i=>i.avulso?`<span class="av">✏️ ${esc(i.nome)}: ${brl(i.preco)}</span>`:`${i.qtd}× ${esc(i.nome)} (${brl(i.preco)})`).join(', ')}</div><div class="it" style="border:0;padding-bottom:0"><span class="mut">${dt(c.data)}${pago&&c.pagoEm?' · pago em '+dt(c.pagoEm)+(c.formaPagamento?' ('+esc(c.formaPagamento)+')':''):''} · Total: <b>${brl(total(c))}</b></span>${pago?`<button class="btn del" data-u="${c.id}">Desfazer</button>`:`<button class="btn" data-p="${c.id}">Marcar pago</button>`}</div></div>`).join('')}
  ${!pago&&cs.length>1?`<button class="btn sec" data-all="${esc(n)}" style="width:100%;margin-top:8px">Marcar tudo de ${esc(n)} como pago</button>`:''}</div>`).join('');
  a.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>confirmar([contas.find(c=>c.id===b.dataset.p)]));
  a.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{if(confirm('Voltar para devendo?'))await db.doc('contas/'+b.dataset.u).update({pago:false,pagoEm:null,formaPagamento:null})});
  a.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>confirmar(grupos[b.dataset.all]));
 }
}
function confirmar(lista){
 const ov=document.getElementById('ov'),ok=document.getElementById('mOk'),chk=document.getElementById('mChk');
 const tot=lista.reduce((s,c)=>s+total(c),0);
 document.getElementById('mSub').textContent=lista[0].cliente+' · '+(lista.length>1?lista.length+' anotações':dt(lista[0].data));
 document.getElementById('mItens').innerHTML=lista.map(c=>c.itens.map(i=>`<div class="li"><span>${i.avulso?'✏️ ':i.qtd+'× '}${esc(i.nome)}${lista.length>1?' <span class="mut">('+dt(c.data)+')</span>':''}</span><span>${brl(i.qtd*i.preco)}</span></div>`).join('')).join('');
 document.getElementById('mTot').textContent='Total: '+brl(tot);
 document.querySelectorAll('input[name=fp]').forEach(r=>r.checked=false);
 chk.checked=false;ok.disabled=true;ok.textContent='Confirmar';
 const upd=()=>ok.disabled=!(chk.checked&&document.querySelector('input[name=fp]:checked'));
 chk.onchange=upd;document.querySelectorAll('input[name=fp]').forEach(r=>r.onchange=upd);
 const fechar=()=>ov.classList.remove('on');
 document.getElementById('mNo').onclick=fechar;ov.onclick=e=>{if(e.target===ov)fechar()};
 ok.onclick=async()=>{
  const forma=document.querySelector('input[name=fp]:checked').value;
  ok.disabled=true;ok.textContent='Salvando…';
  try{for(const c of lista)await db.doc('contas/'+c.id).update({pago:true,pagoEm:Date.now(),formaPagamento:forma});fechar();toast('Pagamento registrado ✓')}
  catch(e){ok.disabled=false;ok.textContent='Confirmar';toast('Erro ao salvar')}
 };
 ov.classList.add('on');
}
function listaRecados(){
 const c=document.getElementById('chat');
 if(c&&tab==='recados'){c.innerHTML=recados.length?recados.map(r=>`<div class="bub ${r.de==='chefe'?'eu':''}">${esc(r.texto)}<small>${r.de==='chefe'?'Você':'Atendente'} · ${new Date(r.data).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${r.de==='chefe'&&r.lido?' · ✓ lido':''}</small></div>`).join(''):'<div class="msg">Nenhum recado ainda.</div>';c.scrollTop=c.scrollHeight;
  recados.filter(r=>r.de==='atendente'&&!r.lido).forEach(r=>db.doc('recados/'+r.id).update({lido:true}).catch(()=>{}))}
 const n=recados.filter(r=>r.de==='atendente'&&!r.lido).length,b=document.getElementById('rc');b.textContent=n;b.style.display=n&&tab!=='recados'?'':'none';
}
let swReg=null;
async function initNotif(){if('serviceWorker' in navigator){try{swReg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready}catch(e){}}updNotifBtn()}
function notifOn(){return 'Notification' in window&&Notification.permission==='granted'}
function updNotifBtn(){document.querySelectorAll('.nbtn').forEach(b=>{const on=notifOn();b.textContent=on?'🔔 Notificações ativas':'🔕 Ativar notificações';b.disabled=on})}
async function pedirNotif(){if(!('Notification' in window)){toast('Este navegador não suporta notificações');return}const p=await Notification.requestPermission();updNotifBtn();if(p==='granted')notificar('Notificações ativadas ✓','Você será avisado por aqui.');else toast('Permissão negada. Libere nas configurações do navegador.')}
function notificar(t,b){toast(t+(b?' — '+b:''));if(!notifOn())return;try{if(swReg)swReg.showNotification(t,{body:b,data:location.href});else new Notification(t,{body:b})}catch(e){}}

(async()=>{
 try{firebase.initializeApp(firebaseConfig);db=firebase.firestore()}catch(e){db=null}
 if(!db){render();return}
 let c1=true,r1=true;
 db.collection('contas').onSnapshot(s=>{
  if(!c1)s.docChanges().forEach(ch=>{if(ch.type==='added'&&!ch.doc.metadata.hasPendingWrites){const d=ch.doc.data();notificar('🧾 Nova anotação (devendo)',d.cliente+' — '+brl(total(d)))}});
  c1=false;contas=s.docs.map(d=>({id:d.id,...d.data()}));stats();if(tab!=='recados')render()},()=>{});
 db.collection('recados').orderBy('data').onSnapshot(s=>{
  if(!r1)s.docChanges().forEach(ch=>{const d=ch.doc.data();if(ch.type==='added'&&d.de==='atendente')notificar('💬 Novo recado',d.texto)});
  r1=false;recados=s.docs.map(d=>({id:d.id,...d.data()}));listaRecados()},()=>{});
 initNotif();
 render();
})();
</script>

</body></html>
