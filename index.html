<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caderneta — Painel</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#e2e5eb;--pri:#2a5bd7;--pris:#e8eefc;--ok:#1e8a5a;--oks:#e4f4ec;--bad:#c9372c;--bads:#fbe8e6;--side:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121418;--card:#1b1e24;--ink:#e7e9ee;--mut:#9aa1b0;--line:#2b2f37;--pri:#6f95f2;--pris:#1f2a44;--ok:#4cc38a;--oks:#173226;--bad:#ef7b70;--bads:#3a1f1d;--side:#171a1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.layout{display:flex;min-height:100vh}
aside{width:230px;background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{font-weight:800;font-size:17px;padding:4px 10px 18px}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.menu a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;margin-bottom:2px}
.menu a:hover{background:var(--bg)}
.menu a.on{background:var(--pris);color:var(--pri);font-weight:600}
main{flex:1;min-width:0;padding:24px 28px 90px;max-width:1000px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
.back{color:var(--pri);cursor:pointer;font-size:14px;margin-bottom:6px;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 4px}.card p.sub{margin:0 0 14px;color:var(--mut);font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus{outline:2px solid var(--pris);border-color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pfx{position:relative}.pfx span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}.pfx input{padding-left:36px}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.link{background:none;color:var(--bad);padding:6px}
.btn:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.cl{cursor:pointer}tbody tr.cl:hover{background:var(--bg)}
.thumb{width:38px;height:38px;border-radius:8px;background:var(--pris);color:var(--pri);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.pn{display:flex;gap:10px;align-items:center}
.mut{color:var(--mut);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--mut)}
.tag.dev{background:var(--bads);color:var(--bad)}.tag.ok{background:var(--oks);color:var(--ok)}
.tablewrap{padding:0;overflow:hidden}
.toolbar{padding:12px;border-bottom:1px solid var(--line)}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--bg);color:var(--ink);width:32px;height:32px;font-size:17px;cursor:pointer}
.qty span{min-width:34px;text-align:center;font-weight:600}
.sug{border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:240px;overflow:auto;background:var(--card)}
.sug div{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.sug div:last-child{border:0}.sug div:hover{background:var(--pris)}
.sum{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;padding-top:14px;margin-top:6px;border-top:1px solid var(--line)}
.bar{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:10px;padding:12px 0}
.chat{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto;padding:4px 2px 10px}
.bub{max-width:80%;padding:9px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.bub.eu{align-self:flex-end;background:var(--pris);border-color:transparent}
.bub small{display:block;font-size:11px;color:var(--mut);margin-top:3px}
.send{display:flex;gap:8px}.send textarea{flex:1;min-height:44px;max-height:120px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.cnt{background:#d33;color:#fff;border-radius:20px;font-size:11px;padding:0 6px;margin-left:4px;font-weight:700}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:9}
img.thumb{object-fit:cover;padding:0}
.st-zero,.st-baixo{background:var(--bads)!important;color:var(--bad)!important;font-weight:700}.st-aten{background:#fff3d6!important;color:#9a6400!important}.st-ok{background:var(--oks)!important;color:var(--ok)!important}
@media (prefers-color-scheme:dark){.st-aten{background:#3a2e12!important;color:#f0c060!important}}
.alerta{background:var(--bads);border-color:transparent;color:var(--bad)}
.fotobox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.fotop{width:130px;height:130px;border-radius:10px;object-fit:cover;border:1px solid var(--line);display:block}.fotop.vazio{display:grid;place-items:center;color:var(--mut);background:var(--bg);font-size:13px}
input.cq{padding:8px;text-align:center}input.cq.mud{border-color:var(--pri);background:var(--pris);font-weight:700}
.hidem{}
@media(max-width:760px){
 aside{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;padding:6px;border-right:0;border-top:1px solid var(--line);z-index:5}
 .brand{display:none}.menu{display:flex}.menu a{flex:1;flex-direction:column;gap:2px;font-size:12px;padding:8px 4px;text-align:center}
 main{padding:18px 16px 100px}.grid2{grid-template-columns:1fr}.hidem{display:none}
 td,th{padding:10px 8px}
}
</style></head><body>
<div class="layout">
<aside><div class="brand">📒 Caderneta<small>Painel do atendente</small></div>
<nav class="menu">
<a data-v="anotar"><span>🧾</span>Nova anotação</a>
<a data-v="produtos"><span>📦</span>Produtos</a>
<a data-v="clientes"><span>👤</span>Clientes</a>
<a data-v="recentes"><span>🕘</span>Anotações</a>
<a data-v="recados"><span>💬</span>Recados<b class="cnt" id="rc" style="display:none"></b></a>
</nav><button class="btn sec nbtn hidem" style="width:100%;margin-top:14px" onclick="pedirNotif()">🔕 Ativar notificações</button></aside>
<main id="app"><div class="empty">Carregando…</div></main>
</div>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCCIurNw6ZI4eYCPLxfZK0TXIfhQKJxCRU",
  authDomain: "leme1adm.firebaseapp.com",
  projectId: "leme1adm",
  storageBucket: "leme1adm.firebasestorage.app",
  messagingSenderId: "938106754737",
  appId: "1:938106754737:web:119b8e5407648b4b963490"
};
</script>
<script>
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=ms=>new Date(ms).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const num=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'));
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2300)}
let db=null,clientes=[],cliId=null,filtroC='',recados=[],produtos=[],contas=[],view='anotar',editId=null,carrinho=[],cliente='',filtroP='';
const total=c=>c.itens.reduce((s,i)=>s+i.qtd*i.preco,0);

document.querySelectorAll('.menu a').forEach(a=>a.onclick=()=>go(a.dataset.v));
function go(v,id){view=v;cliId=v==='cform'?id:null;if(typeof listaRecados==='function'&&recados)setTimeout(listaRecados);editId=id||null;document.querySelectorAll('.menu a').forEach(a=>a.classList.toggle('on',a.dataset.v===(v==='form'||v==='contagem'?'produtos':v==='cform'?'clientes':v)));render();scrollTo(0,0)}

function render(){
 const a=$('app');
 if(!db){a.innerHTML='<div class="empty">Não foi possível conectar ao banco. Confira a configuração do Firebase.</div>';return}
 ({anotar:vAnotar,produtos:vProdutos,form:vForm,recentes:vRecentes,recados:vRecados,clientes:vClientes,cform:vCForm,contagem:vContagem})[view](a);
}

/* ---------- PRODUTOS / ESTOQUE ---------- */
function stEst(p){
 if(p.qtd==null||p.qtd==='')return{k:'na',t:'Sem contagem',o:3};
 const q=+p.qtd,m=+p.minimo||0;
 if(q<=0)return{k:'zero',t:'Esgotado',o:0};
 if(m>0&&q<=m)return{k:'baixo',t:'Fazer pedido',o:1};
 if(m>0&&q<=m*1.5)return{k:'aten',t:'Acabando',o:2};
 return{k:'ok',t:'Em estoque',o:4};
}
const qtdTxt=p=>p.qtd==null||p.qtd===''?'—':(+p.qtd)+' '+(p.unidade||'un');
const capa=(p,cls='thumb')=>p.foto?`<img class="${cls}" src="${p.foto}" alt="">`:`<div class="${cls}">${esc((p.nome||'?')[0].toUpperCase())}</div>`;
function comprimir(file,max=640,q=.72){return new Promise((ok,err)=>{const img=new Image();img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);ok(c.toDataURL('image/jpeg',q))};img.onerror=err;img.src=URL.createObjectURL(file)})}

function vProdutos(a){
 const f=filtroP.toLowerCase();
 const l=produtos.filter(p=>(p.nome+' '+(p.codigo||'')+' '+(p.categoria||'')).toLowerCase().includes(f)).sort((x,y)=>stEst(x).o-stEst(y).o||x.nome.localeCompare(y.nome));
 const urg=produtos.filter(p=>stEst(p).o<=1).length,at=produtos.filter(p=>stEst(p).o===2).length;
 a.innerHTML=`<div class="top"><h1>Produtos e estoque</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" id="cont">📋 Contagem de estoque</button><button class="btn" id="novo">+ Adicionar produto</button></div></div>
 ${urg||at?`<div class="card alerta"><b>⚠️ ${urg} produto(s) para pedir</b>${at?` · <span>${at} acabando</span>`:''}<div class="mut" style="color:inherit;opacity:.8">A chefe vê esses alertas no topo do painel dela.</div></div>`:''}
 <div class="card tablewrap"><div class="toolbar"><input id="fp" placeholder="🔍 Buscar por nome, código ou categoria" value="${esc(filtroP)}"></div>
 ${l.length?`<table><thead><tr><th>Produto</th><th class="hidem">Categoria</th><th>Preço</th><th>Estoque</th></tr></thead><tbody>
 ${l.map(p=>{const s=stEst(p);return `<tr class="cl" data-e="${p.id}"><td><div class="pn">${capa(p)}<div>${esc(p.nome)}${p.codigo?`<div class="mut">Cód. ${esc(p.codigo)}</div>`:''}</div></div></td><td class="hidem">${p.categoria?`<span class="tag">${esc(p.categoria)}</span>`:'<span class="mut">—</span>'}</td><td><b>${brl(p.preco)}</b></td><td><b>${qtdTxt(p)}</b><div><span class="tag st-${s.k}">${s.t}</span></div></td></tr>`}).join('')}
 </tbody></table>`:`<div class="empty">${produtos.length?'Nenhum produto encontrado.':'Você ainda não cadastrou produtos.<br><br><button class="btn" onclick="go(\'form\')">Cadastrar o primeiro</button>'}</div>`}</div>
 <p class="mut">${produtos.length} produto(s) cadastrado(s)</p>`;
 $('novo').onclick=()=>go('form');$('cont').onclick=()=>go('contagem');
 const fp=$('fp');fp.oninput=()=>{filtroP=fp.value;const pos=fp.selectionStart;vProdutos(a);const n=$('fp');n.focus();n.setSelectionRange(pos,pos)};
 a.querySelectorAll('[data-e]').forEach(r=>r.onclick=()=>go('form',r.dataset.e));
}

let fotoTmp;
function vForm(a){
 const p=produtos.find(x=>x.id===editId)||{};
 fotoTmp=p.foto||'';
 const cats=[...new Set(produtos.map(x=>x.categoria).filter(Boolean))];
 const dec=v=>v!=null&&v!==''?String((+v).toFixed(2)).replace('.',','):'';
 a.innerHTML=`<span class="back" onclick="go('produtos')">← Produtos</span>
 <div class="top"><h1>${editId?'Editar produto':'Adicionar produto'}</h1></div>
 <div class="card"><h2>Foto de capa</h2><p class="sub">Aparece no painel da chefe. Opcional.</p>
  <div class="fotobox"><div id="fprev"></div><div style="display:flex;flex-direction:column;gap:8px">
   <label class="btn sec" style="margin:0;text-align:center">📷 Tirar foto<input type="file" accept="image/*" capture="environment" id="fcam" hidden></label>
   <label class="btn sec" style="margin:0;text-align:center">🖼️ Carregar da galeria<input type="file" accept="image/*" id="fgal" hidden></label>
   <button class="btn link" id="frem" style="display:none">Remover foto</button></div></div></div>
 <div class="card"><h2>Nome e identificação</h2>
  <label>Nome do produto *</label><input id="fn" value="${esc(p.nome)}" placeholder="Ex: Refrigerante Cola 2L">
  <div class="grid2"><div><label>Código <span class="mut">(opcional)</span></label><input id="fc" value="${esc(p.codigo)}" placeholder="Ex: 7891234"></div>
  <div><label>Categoria</label><input id="fk" list="cats" value="${esc(p.categoria)}" placeholder="Ex: Bebidas"><datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div></div>
 </div>
 <div class="card"><h2>Preço</h2>
  <div class="grid2"><div><label>Preço de venda *</label><div class="pfx"><span>R$</span><input id="fv" inputmode="decimal" value="${dec(p.preco)}" placeholder="0,00"></div></div>
  <div><label>Preço de custo <span class="mut">(opcional)</span></label><div class="pfx"><span>R$</span><input id="fcu" inputmode="decimal" value="${dec(p.custo)}" placeholder="0,00"></div></div></div>
 </div>
 <div class="card"><h2>Estoque</h2><p class="sub">Quando a quantidade chegar no mínimo, aparece o alerta vermelho de "Fazer pedido" para a chefe.</p>
  <div class="grid2" style="grid-template-columns:1fr 1fr 1fr"><div><label>Quantidade atual</label><input id="fq" type="number" inputmode="numeric" min="0" step="any" value="${p.qtd??''}" placeholder="0"></div>
  <div><label>Estoque mínimo</label><input id="fm" type="number" inputmode="numeric" min="0" step="any" value="${p.minimo??''}" placeholder="Ex: 5"></div>
  <div><label>Unidade</label><select id="fu">${['un','cx','fardo','pct','kg','L','dz'].map(u=>`<option ${(p.unidade||'un')===u?'selected':''}>${u}</option>`).join('')}</select></div></div>
  ${p.estoqueEm?`<p class="mut" style="margin:10px 0 0">Última atualização: ${dt(p.estoqueEm)}</p>`:''}
 </div>
 <div class="bar">${editId?'<button class="btn sec" id="del" style="color:var(--bad);margin-right:auto">Excluir</button>':''}<button class="btn sec" onclick="go('produtos')">Cancelar</button><button class="btn" id="sv">Salvar</button></div>`;
 const prev=()=>{$('fprev').innerHTML=fotoTmp?`<img class="fotop" src="${fotoTmp}">`:'<div class="fotop vazio">Sem foto</div>';$('frem').style.display=fotoTmp?'':'none'};prev();
 const pega=async e=>{const f=e.target.files[0];if(!f)return;try{fotoTmp=await comprimir(f);prev()}catch(_){toast('Não consegui ler essa imagem')}e.target.value=''};
 $('fcam').onchange=pega;$('fgal').onchange=pega;$('frem').onclick=()=>{fotoTmp='';prev()};
 if(!editId)$('fn').focus();
 $('sv').onclick=async()=>{
  const nome=$('fn').value.trim(),preco=num($('fv').value);
  if(!nome){toast('Informe o nome');return} if(!(preco>=0)){toast('Informe um preço válido');return}
  const qv=$('fq').value,mv=$('fm').value,cu=num($('fcu').value);
  const d={nome,preco,codigo:$('fc').value.trim(),categoria:$('fk').value.trim(),custo:cu>=0?cu:null,qtd:qv===''?null:+qv,minimo:mv===''?null:+mv,unidade:$('fu').value,foto:fotoTmp||'',estoqueEm:p.estoqueEm||null};
  if(String(p.qtd??'')!==qv)d.estoqueEm=Date.now();
  $('sv').disabled=true;
  try{editId?await db.doc('produtos/'+editId).set(d):await db.collection('produtos').add(d);toast('Produto salvo');go('produtos')}
  catch(e){$('sv').disabled=false;toast('Erro ao salvar'+(e.code==='invalid-argument'?' (foto muito grande)':''))}
 };
 if(editId)$('del').onclick=async()=>{if(!confirm('Excluir "'+p.nome+'"?'))return;await db.doc('produtos/'+editId).delete();toast('Produto excluído');go('produtos')};
}

/* contagem rápida */
let rasc={};
function vContagem(a){
 const grupos={};produtos.forEach(p=>(grupos[p.categoria||'Sem categoria']??=[]).push(p));
 const alt=Object.keys(rasc).length;
 a.innerHTML=`<span class="back" onclick="go('produtos')">← Produtos</span>
 <div class="top"><h1>Contagem de estoque</h1></div>
 <p class="mut" style="margin-top:-8px">Digite o que você contou. Só os produtos alterados são salvos.</p>
 ${produtos.length?Object.keys(grupos).sort().map(g=>`<div class="card tablewrap"><div class="toolbar"><b>${esc(g)}</b></div><table><thead><tr><th>Produto</th><th style="width:96px">Qtd</th><th style="width:82px">Mín.</th></tr></thead><tbody>
 ${grupos[g].sort((x,y)=>x.nome.localeCompare(y.nome)).map(p=>{const r=rasc[p.id]||{},v={...p,...r},s=stEst(v);return `<tr><td><div class="pn">${capa(p)}<div>${esc(p.nome)}<div><span class="tag st-${s.k}" id="t-${p.id}">${s.t}</span></div></div></div></td>
 <td><input class="cq${r.qtd!==undefined?' mud':''}" data-id="${p.id}" data-f="qtd" type="number" inputmode="numeric" min="0" step="any" value="${v.qtd??''}"></td>
 <td><input class="cq${r.minimo!==undefined?' mud':''}" data-id="${p.id}" data-f="minimo" type="number" inputmode="numeric" min="0" step="any" value="${v.minimo??''}"></td></tr>`}).join('')}
 </tbody></table></div>`).join(''):'<div class="empty">Cadastre produtos primeiro.</div>'}
 <div class="bar"><button class="btn sec" id="cdes" ${alt?'':'disabled'}>Descartar</button><button class="btn" id="csal" ${alt?'':'disabled'}>Salvar contagem${alt?' ('+alt+')':''}</button></div>`;
 a.querySelectorAll('.cq').forEach(i=>i.oninput=()=>{
  const p=produtos.find(x=>x.id===i.dataset.id),f=i.dataset.f,val=i.value===''?null:+i.value;
  const r=rasc[p.id]||{};if(val===(p[f]??null))delete r[f];else r[f]=val;
  if(Object.keys(r).length)rasc[p.id]=r;else delete rasc[p.id];
  i.classList.toggle('mud',r[f]!==undefined);
  const s=stEst({...p,...r}),t=$('t-'+p.id);t.className='tag st-'+s.k;t.textContent=s.t;
  const n=Object.keys(rasc).length;$('csal').disabled=$('cdes').disabled=!n;$('csal').textContent='Salvar contagem'+(n?' ('+n+')':'');
 });
 $('cdes').onclick=()=>{if(confirm('Descartar alterações?')){rasc={};vContagem(a)}};
 $('csal').onclick=async()=>{
  $('csal').disabled=true;$('csal').textContent='Salvando…';
  try{const b=db.batch(),agora=Date.now();Object.entries(rasc).forEach(([id,r])=>b.update(db.doc('produtos/'+id),{...r,...('qtd' in r?{estoqueEm:agora}:{})}));await b.commit();
   toast('Contagem salva ✓ ('+Object.keys(rasc).length+')');rasc={};go('produtos')}
  catch(e){toast('Erro ao salvar');vContagem(a)}
 };
}

/* ---------- NOVA ANOTAÇÃO ---------- */
function vAnotar(a){
 const nomes=listaClientes().map(c=>c.nome);
 const t=carrinho.reduce((s,i)=>s+i.qtd*i.preco,0);
 a.innerHTML=`<div class="top"><h1>Nova anotação</h1></div>
 <div class="card"><h2>Cliente</h2><input id="cl" list="cls" value="${esc(cliente)}" placeholder="Nome do cliente"><datalist id="cls">${nomes.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
 <div class="card"><h2>Produtos</h2><p class="sub">Busque e toque no produto para adicionar.</p>
  ${produtos.length?`<input id="bp" placeholder="🔍 Buscar produto" autocomplete="off"><div id="sug"></div>`:`<div class="empty">Nenhum produto cadastrado. <a href="#" onclick="go('form');return false">Cadastrar agora</a></div>`}
  <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:4px"><label>Ou adicione um valor avulso</label>
  <div class="grid2" style="grid-template-columns:1fr 130px auto;align-items:center"><input id="ad" placeholder="Descrição (opcional)"><div class="pfx"><span>R$</span><input id="av" inputmode="decimal" placeholder="0,00"></div><button class="btn sec" id="aadd">+ Adicionar</button></div></div>
  ${carrinho.length?`<table style="margin-top:12px"><thead><tr><th>Item</th><th>Qtd</th><th style="text-align:right">Subtotal</th><th></th></tr></thead><tbody>
  ${carrinho.map((i,k)=>`<tr><td>${esc(i.nome)}<div class="mut">${brl(i.preco)} un.</div></td><td><div class="qty"><button data-m="${k}">−</button><span>${i.qtd}</span><button data-p="${k}">+</button></div></td><td style="text-align:right"><b>${brl(i.qtd*i.preco)}</b></td><td><button class="btn link" data-r="${k}">✕</button></td></tr>`).join('')}
  </tbody></table><div class="sum"><span>Total</span><span>${brl(t)}</span></div>`:''}
 </div>
 <div class="bar">${carrinho.length?'<button class="btn sec" id="limpar">Limpar</button>':''}<button class="btn" id="salvar" ${carrinho.length?'':'disabled'}>Salvar anotação</button></div>`;
 $('cl').oninput=e=>cliente=e.target.value;
 const bp=$('bp');
 if(bp){bp.oninput=()=>{const q=bp.value.toLowerCase().trim();const l=q?produtos.filter(p=>(p.nome+' '+(p.codigo||'')).toLowerCase().includes(q)).slice(0,8):[];
  $('sug').className=l.length?'sug':'';$('sug').innerHTML=l.map(p=>`<div data-a="${p.id}"><span>${esc(p.nome)}</span><b>${brl(p.preco)}</b></div>`).join('');
  $('sug').querySelectorAll('[data-a]').forEach(d=>d.onclick=()=>{const p=produtos.find(x=>x.id===d.dataset.a);const ex=carrinho.find(i=>i.pid===p.id);ex?ex.qtd++:carrinho.push({pid:p.id,nome:p.nome,preco:p.preco,qtd:1});vAnotar(a);$('bp').focus()})}}
 const addAv=()=>{const v=num($('av').value);if(!(v>0)){toast('Informe um valor');$('av').focus();return}carrinho.push({pid:null,nome:$('ad').value.trim()||'Valor avulso',preco:v,qtd:1});vAnotar(a);$('av').focus()};
 $('aadd').onclick=addAv;$('av').onkeydown=e=>{if(e.key==='Enter')addAv()};
 a.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{carrinho[b.dataset.p].qtd++;vAnotar(a)});
 a.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=carrinho[b.dataset.m];i.qtd>1?i.qtd--:carrinho.splice(b.dataset.m,1);vAnotar(a)});
 a.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{carrinho.splice(b.dataset.r,1);vAnotar(a)});
 if($('limpar'))$('limpar').onclick=()=>{if(confirm('Limpar itens?')){carrinho=[];vAnotar(a)}};
 $('salvar').onclick=async()=>{
  const n=cliente.trim();if(!n){toast('Informe o cliente');$('cl').focus();return}
  $('salvar').disabled=true;
  try{const cid=await garantirCliente(n);const nomeOk=(clientes.find(x=>x.id===cid)||{}).nome||n;await db.collection('contas').add({cliente:nomeOk,clienteId:cid,itens:carrinho.map(({pid,nome,preco,qtd})=>pid?{nome,preco,qtd}:{nome,preco,qtd,avulso:true}),data:Date.now(),pago:false});carrinho=[];cliente='';toast('Anotação salva ✓');vAnotar(a)}
  catch(e){$('salvar').disabled=false;toast('Erro ao salvar')}
 };
}

/* ---------- CLIENTES ---------- */
const norm=s=>String(s||'').trim().toLowerCase();
const contasDe=c=>contas.filter(x=>c.id&&x.clienteId===c.id||(!x.clienteId&&norm(x.cliente)===norm(c.nome)));
function listaClientes(){
 const l=clientes.map(c=>({...c}));
 contas.forEach(x=>{if(!x.clienteId&&!l.some(c=>norm(c.nome)===norm(x.cliente)))l.push({id:null,nome:x.cliente})});
 return l.sort((a,b)=>a.nome.localeCompare(b.nome));
}
async function garantirCliente(nome){
 const ex=clientes.find(c=>norm(c.nome)===norm(nome));
 if(ex)return ex.id;
 const r=await db.collection('clientes').add({nome:nome.trim(),telefone:'',obs:'',criado:Date.now()});return r.id;
}
function vClientes(a){
 const f=norm(filtroC),l=listaClientes().filter(c=>norm(c.nome+' '+(c.telefone||'')).includes(f));
 a.innerHTML=`<div class="top"><h1>Clientes</h1><button class="btn" id="ncli">+ Novo cliente</button></div>
 <div class="card tablewrap"><div class="toolbar"><input id="fcl" placeholder="🔍 Buscar por nome ou telefone" value="${esc(filtroC)}"></div>
 ${l.length?`<table><thead><tr><th>Cliente</th><th class="hidem">Telefone</th><th>Devendo</th></tr></thead><tbody>
 ${l.map((c,k)=>{const cs=contasDe(c),dev=cs.filter(x=>!x.pago).reduce((s,x)=>s+total(x),0);return `<tr class="cl" data-k="${k}"><td><div class="pn"><div class="thumb">${esc((c.nome[0]||'?').toUpperCase())}</div><div>${esc(c.nome)}<div class="mut">${cs.length} anotação(ões)${c.id?'':' · sem perfil'}</div></div></div></td><td class="hidem">${esc(c.telefone)||'<span class="mut">—</span>'}</td><td>${dev?`<span class="tag dev">${brl(dev)}</span>`:'<span class="tag ok">Em dia</span>'}</td></tr>`}).join('')}
 </tbody></table>`:'<div class="empty">Nenhum cliente ainda.</div>'}</div>`;
 $('ncli').onclick=()=>go('cform','new');
 const fc=$('fcl');fc.oninput=()=>{filtroC=fc.value;const p=fc.selectionStart;vClientes(a);const n=$('fcl');n.focus();n.setSelectionRange(p,p)};
 a.querySelectorAll('[data-k]').forEach(r=>r.onclick=()=>{const c=l[r.dataset.k];go('cform',c.id||('nome:'+c.nome))});
}
function vCForm(a){
 const novo=cliId==='new',soNome=String(cliId).startsWith('nome:');
 const c=novo?{nome:''}:soNome?{id:null,nome:cliId.slice(5)}:(clientes.find(x=>x.id===cliId)||{nome:''});
 const cs=novo?[]:contasDe(c).sort((x,y)=>y.data-x.data),dev=cs.filter(x=>!x.pago).reduce((s,x)=>s+total(x),0);
 a.innerHTML=`<span class="back" onclick="go('clientes')">← Clientes</span>
 <div class="top"><h1>${novo?'Novo cliente':esc(c.nome)}</h1>${novo?'':`<span class="tag ${dev?'dev':'ok'}" style="font-size:14px">${dev?'Devendo '+brl(dev):'Em dia'}</span>`}</div>
 <div class="card"><h2>Dados do cliente</h2><p class="sub">Ao mudar o nome, todas as anotações dele são atualizadas, inclusive na página da chefe.</p>
  <label>Nome *</label><input id="cn" value="${esc(c.nome)}">
  <div class="grid2"><div><label>Telefone <span class="mut">(opcional)</span></label><input id="ct" inputmode="tel" value="${esc(c.telefone)}" placeholder="(00) 00000-0000"></div>
  <div><label>Observação <span class="mut">(opcional)</span></label><input id="co" value="${esc(c.obs)}" placeholder="Ex: paga todo dia 10"></div></div>
 </div>
 ${novo?'':`<div class="card tablewrap"><div class="toolbar"><b>Histórico</b> <span class="mut">(${cs.length})</span></div>${cs.length?`<table><tbody>${cs.map(x=>`<tr><td><div class="mut">${dt(x.data)}</div>${x.itens.map(i=>i.avulso?esc(i.nome)+' '+brl(i.preco):i.qtd+'× '+esc(i.nome)).join(', ')}</td><td><b>${brl(total(x))}</b></td><td><span class="tag ${x.pago?'ok':'dev'}">${x.pago?'Pago':'Devendo'}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Sem anotações.</div>'}</div>`}
 <div class="bar"><button class="btn sec" onclick="go('clientes')">Cancelar</button><button class="btn" id="csv">Salvar</button></div>`;
 $('csv').onclick=async()=>{
  const nome=$('cn').value.trim();if(!nome){toast('Informe o nome');return}
  const outro=clientes.find(x=>norm(x.nome)===norm(nome)&&x.id!==c.id);
  if(outro){toast('Já existe um cliente com esse nome');return}
  const d={nome,telefone:$('ct').value.trim(),obs:$('co').value.trim()};
  $('csv').disabled=true;$('csv').textContent='Salvando…';
  try{
   let id=c.id;
   if(id)await db.doc('clientes/'+id).update(d);else{const r=await db.collection('clientes').add({...d,criado:Date.now()});id=r.id}
   const b=db.batch();let n=0;
   cs.forEach(x=>{if(x.cliente!==nome||x.clienteId!==id){b.update(db.doc('contas/'+x.id),{cliente:nome,clienteId:id});n++}});
   if(n)await b.commit();
   toast('Cliente salvo ✓'+(n?' · '+n+' anotação(ões) atualizada(s)':''));go('clientes');
  }catch(e){$('csv').disabled=false;$('csv').textContent='Salvar';toast('Erro ao salvar')}
 };
}

/* ---------- ANOTAÇÕES RECENTES ---------- */
function vRecentes(a){
 const l=[...contas].sort((x,y)=>y.data-x.data).slice(0,50);
 a.innerHTML=`<div class="top"><h1>Anotações</h1><span class="mut">Últimas 50</span></div>
 <div class="card tablewrap">${l.length?`<table><thead><tr><th>Cliente</th><th class="hidem">Itens</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>
 ${l.map(c=>`<tr><td><b>${esc(c.cliente)}</b><div class="mut">${dt(c.data)}</div></td><td class="hidem mut">${c.itens.map(i=>i.avulso?esc(i.nome)+' '+brl(i.preco):i.qtd+'× '+esc(i.nome)).join(', ')}</td><td><b>${brl(total(c))}</b></td><td><span class="tag ${c.pago?'ok':'dev'}">${c.pago?'Pago':'Devendo'}</span></td><td>${c.pago?'':`<button class="btn link" data-x="${c.id}" title="Excluir">✕</button>`}</td></tr>`).join('')}
 </tbody></table>`:'<div class="empty">Nenhuma anotação ainda.</div>'}</div>`;
 a.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir esta anotação? Use só se foi anotada por engano.'))await db.doc('contas/'+b.dataset.x).delete()});
}

/* ---------- RECADOS ---------- */
function vRecados(a){
 a.innerHTML=`<div class="top"><h1>Recados</h1><button class="btn sec nbtn" onclick="pedirNotif()"></button></div>
 <div class="card"><div class="chat" id="chat"></div>
 <div class="send"><textarea id="rt" placeholder="Escreva um recado para a chefe…"></textarea><button class="btn" id="rs">Enviar</button></div></div>`;
 updNotifBtn();listaRecados();
 $('rs').onclick=async()=>{const t=$('rt').value.trim();if(!t)return;$('rs').disabled=true;try{await db.collection('recados').add({de:'atendente',texto:t,data:Date.now(),lido:false});$('rt').value=''}catch(e){toast('Erro ao enviar')}$('rs').disabled=false;$('rt').focus()};
}
function listaRecados(){
 const c=$('chat');
 if(c){c.innerHTML=recados.length?recados.map(r=>`<div class="bub ${r.de==='atendente'?'eu':''}">${esc(r.texto)}<small>${r.de==='atendente'?'Você':'Chefe'} · ${dt(r.data)}${r.de==='atendente'&&r.lido?' · ✓ lido':''}</small></div>`).join(''):'<div class="empty">Nenhum recado ainda.</div>';c.scrollTop=c.scrollHeight;
  recados.filter(r=>r.de==='chefe'&&!r.lido).forEach(r=>db.doc('recados/'+r.id).update({lido:true}).catch(()=>{}))}
 const n=recados.filter(r=>r.de==='chefe'&&!r.lido).length,b=$('rc');b.textContent=n;b.style.display=n&&view!=='recados'?'':'none';
}

/* ---------- NOTIFICAÇÕES ---------- */
let swReg=null;
async function initNotif(){if('serviceWorker' in navigator){try{swReg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready}catch(e){}}updNotifBtn()}
function notifOn(){return 'Notification' in window&&Notification.permission==='granted'}
function updNotifBtn(){document.querySelectorAll('.nbtn').forEach(b=>{const on=notifOn();b.textContent=on?'🔔 Notificações ativas':'🔕 Ativar notificações';b.disabled=on})}
async function pedirNotif(){if(!('Notification' in window)){toast('Este navegador não suporta notificações');return}const p=await Notification.requestPermission();updNotifBtn();if(p==='granted')notificar('Notificações ativadas ✓','Você será avisado por aqui.');else toast('Permissão negada. Libere nas configurações do navegador.')}
function notificar(t,b){toast(t+(b?' — '+b:''));if(!notifOn())return;try{if(swReg)swReg.showNotification(t,{body:b,data:location.href});else new Notification(t,{body:b})}catch(e){}}

/* ---------- INÍCIO ---------- */
(()=>{
 try{firebase.initializeApp(firebaseConfig);db=firebase.firestore()}catch(e){db=null}
 go('anotar');
 if(!db)return;
 const busy=()=>document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName);
 db.collection('produtos').orderBy('nome').onSnapshot(s=>{produtos=s.docs.map(d=>({id:d.id,...d.data()}));if(!busy()&&view!=='form'&&view!=='contagem')render()},e=>toast('Erro no banco: '+e.code));
 db.collection('clientes').onSnapshot(s=>{clientes=s.docs.map(d=>({id:d.id,...d.data()}));if((view==='clientes'||view==='cform')&&!busy())render()},()=>{});
 let c1=true,r1=true;
 db.collection('contas').onSnapshot(s=>{
  if(!c1)s.docChanges().forEach(ch=>{if(ch.type!=='modified')return;const d=ch.doc.data(),o=contas.find(c=>c.id===ch.doc.id);if(!o)return;
   if(d.pago&&!o.pago)notificar('💰 Pagamento confirmado',d.cliente+' pagou '+brl(total(d))+(d.formaPagamento?' ('+d.formaPagamento+')':''));
   if(!d.pago&&o.pago)notificar('↩️ Voltou para devendo',d.cliente+' — '+brl(total(d)))});
  c1=false;contas=s.docs.map(d=>({id:d.id,...d.data()}));if((view==='recentes'||view==='clientes'||view==='cform')&&!busy())render()},()=>{});
 db.collection('recados').orderBy('data').onSnapshot(s=>{
  if(!r1)s.docChanges().forEach(ch=>{const d=ch.doc.data();if(ch.type==='added'&&d.de==='chefe')notificar('💬 Recado da chefe',d.texto)});
  r1=false;recados=s.docs.map(d=>({id:d.id,...d.data()}));listaRecados()},()=>{});
 initNotif();
})();
</script>
</body></html>
